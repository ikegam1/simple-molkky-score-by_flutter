name: simple_molkky_score
description: "A simple Molkky scoreboard app."
publish_to: 'none'
version: 1.15.26+128

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.3
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.6.1
  patrol: ^4.2.0
  google_sign_in: ^6.2.0
  # Apple Sign-In (App Store 審査要件: Google 等の第三者サインインを提供する
  # 場合、Sign in with Apple を並列で提供する必要がある - App Store Review
  # Guidelines 4.8)。Firebase Auth の signInWithCredential に OAuth の identityToken
  # を渡して連携する。
  sign_in_with_apple: ^6.1.4
  # Apple Sign-In で nonce (SHA-256) を生成するため。Firebase Auth の
  # OAuthProvider("apple.com") では identityToken と平文 nonce が一致する
  # ことを検証するため、client 側で raw nonce と sha256(nonce) の両方を持つ。
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  web: ^1.1.0
  gal: ^2.3.0
  # 累計 3 試合以上プレイしたユーザーに、試合終了直後の自然な休止で
  # Google Play In-App Review を促す。Play 側で再表示 quota を throttle
  # するため、アプリ側は 3 試合閾値のみを管理する。
  in_app_review: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  # 「直」「近」等の CJK 統合漢字が中国語字形にフォールバックしないよう、
  # Noto Sans JP (Variable Font, ~9.5 MB) を同梱し `ThemeData.fontFamily`
  # から明示指定する。VF なので Regular/Bold は同一ファイル内の
  # weight 軸で切り替わる (別ファイル不要)。
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
