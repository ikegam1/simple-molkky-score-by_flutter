name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-test:
    # **ubuntu-latest にしない。**
    #
    # GitHub の ubuntu-latest が 26.04 に移った結果、Playwright が
    # ブラウザを入れられなくなり CI が落ちるようになった
    # (2026-10-28: "Playwright does not support chromium on ubuntu26.04-x64")。
    # Playwright 側が 26.04 に対応するまでは runner を固定する。
    # 対応が入ったら ubuntu-latest に戻してよい。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Firebase Options File
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Playwright Dependencies
        run: |
          cd e2e_tests
          npm install
          npx playwright install --with-deps chromium

      - name: Build Web for Test
        run: flutter build web --release --base-href /

      - name: Run E2E Tests
        run: |
          cd e2e_tests
          npm run test
      
      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e_tests/playwright-report/
          retention-days: 30

      - name: Build Web for Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build web --release --base-href "/"

      - name: Deploy Web to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: easy-molkky-score.ikegam1.com
